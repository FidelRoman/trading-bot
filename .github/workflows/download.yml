name: Download FXCM history

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated FXCM symbols
        required: true
        default: EUR/USD,XAU/USD,GBP/USD
        type: string
      timeframes:
        description: Comma-separated timeframes
        required: true
        default: h4,d1
        type: string
      years:
        description: Years of history
        required: true
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy Linux SDK
        run: |
          python -m pip install "pip<24.1"
          python -m pip install "forexconnect==1.6.5.1" "pandas<2" "numpy<1.22"
      - name: Download history
        env:
          FXCM_USER: ${{ secrets.FXCM_USER }}
          FXCM_PASS: ${{ secrets.FXCM_PASS }}
          FXCM_CONNECTION: Demo
        run: >-
          python scripts/download_history.py
          --symbols "${{ inputs.symbols }}"
          --timeframes "${{ inputs.timeframes }}"
          --years "${{ inputs.years }}"
      - name: Create checksums
        run: |
          for file in data/history/*.csv; do
            sha256sum "$file" > "$file.sha256"
          done
      - name: Resolve release tag
        id: release
        run: echo "tag=cache-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-${{ steps.release.outputs.tag }}
          path: |
            data/history/*.csv
            data/history/*.sha256
          if-no-files-found: error
      - name: Publish history release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: FSR cache ${{ steps.release.outputs.tag }}
          body: Historical FXCM data and FSR caches generated by GitHub Actions.
          files: |
            data/history/*.csv
            data/history/*.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
