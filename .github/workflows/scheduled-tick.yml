name: Scheduled paper tick

on:
  schedule:
    - cron: "7 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-paper-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake backend and process one closed candle
        env:
          BACKEND_URL: ${{ secrets.BOT_BACKEND_URL }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
        run: |
          test -n "$BACKEND_URL"
          test -n "$BOT_API_TOKEN"
          curl --fail-with-body --retry 4 --retry-all-errors \
            --connect-timeout 30 --max-time 180 \
            -X POST \
            -H "Authorization: Bearer $BOT_API_TOKEN" \
            "${BACKEND_URL%/}/api/scheduled/tick"
