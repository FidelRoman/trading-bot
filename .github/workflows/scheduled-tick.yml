name: Scheduled FXCM executor

on:
  schedule:
    - cron: "*/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-fxcm-executor
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy FXCM runtime
        run: |
          python -m pip install "pip<24.1"
          python -m pip install -r requirements-bot.txt
          sh scripts/fix_forexconnect_linux.sh
      - name: Execute queued commands and process one closed candle
        env:
          FXCM_USER_DEMO: ${{ secrets.FXCM_USER_DEMO }}
          FXCM_PASS_DEMO: ${{ secrets.FXCM_PASS_DEMO }}
          FXCM_USER_REAL: ${{ secrets.FXCM_USER }}
          FXCM_PASS_REAL: ${{ secrets.FXCM_PASS }}
          FIRESTORE_PROJECT_ID: trading-bot-free-20260809
          FIRESTORE_COLLECTION_PREFIX: tradingbot
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/scheduled_tick.py
