name: Scheduled paper tick

on:
  schedule:
    - cron: "7 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-paper-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    container: python:3.7-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy FXCM runtime
        run: |
          python -m pip install "pip<24.1"
          python -m pip install -r requirements-bot.txt
          sh scripts/fix_forexconnect_linux.sh
      - name: Process one closed candle and publish snapshot
        env:
          FXCM_USER: ${{ secrets.FXCM_USER }}
          FXCM_PASS: ${{ secrets.FXCM_PASS }}
          FXCM_CONNECTION: Real
          FIRESTORE_PROJECT_ID: trading-bot-free-20260809
          FIRESTORE_COLLECTION_PREFIX: tradingbot
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/scheduled_tick.py
